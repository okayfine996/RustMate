# T025: Release DMG workflow - Complete Implementation
# This workflow automates the build, sign, notarize, and release process
# 
# ⚠️ SETUP REQUIRED:
# 1. Add secrets to GitHub repository:
#    - APPLE_DEVELOPER_ID_APPLICATION: Developer ID Application certificate (Base64 encoded P12)
#    - CERTIFICATE_PASSWORD: Password for the P12 certificate
#    - NOTARIZATION_APPLE_ID: Apple ID for notarization
#    - NOTARIZATION_TEAM_ID: Team ID (e.g., QFNEHUV3DG)
#    - NOTARIZATION_PASSWORD: App-specific password
#    - SPARKLE_PRIVATE_KEY: EdDSA private key for signing updates (Base64 encoded)
#
# 2. Configure signing certificates in Xcode
# 3. Generate Sparkle EdDSA keys: `./bin/generate_keys`
# 4. Add public key to Xcode Build Settings: SUPublicEDKey

name: Release DMG

on:
  push:
    tags:
      - 'v*.*.*'           # Stable releases: v1.2.0
      - 'v*.*.*-beta.*'    # Beta releases: v1.3.0-beta.1

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Set up variables
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          DMG_NAME="RustMate-${VERSION}.dmg"
          APP_NAME="RustMate"
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_beta=${{ contains(github.ref_name, 'beta') }}" >> $GITHUB_OUTPUT
      
      - name: Install Sparkle tools
        run: |
          echo "📦 Installing Sparkle tools..."
          SPARKLE_VERSION="2.5.2"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o Sparkle.tar.xz
          tar -xf Sparkle.tar.xz
          
          # List extracted contents to debug
          echo "📋 Extracted contents:"
          ls -la
          
          # Create bin directory
          mkdir -p bin
          
          # Try to find and copy Sparkle tools
          if [ -d "Sparkle-${SPARKLE_VERSION}/bin" ]; then
            echo "Found Sparkle-${SPARKLE_VERSION}/bin directory"
            cp Sparkle-${SPARKLE_VERSION}/bin/* bin/
          elif [ -d "bin" ] && [ -f "bin/generate_appcast" ]; then
            echo "Found bin directory at root"
            cp bin/* bin/ 2>/dev/null || true
          else
            echo "Searching for Sparkle tools..."
            # Find generate_appcast and other tools
            find . -name "generate_appcast" -type f -exec cp {} bin/ \;
            find . -name "generate_keys" -type f -exec cp {} bin/ \;
            find . -name "sign_update" -type f -exec cp {} bin/ \;
            
            # Also check common Sparkle directory structures
            for dir in Sparkle* sparkle*; do
              if [ -d "$dir" ]; then
                echo "Checking directory: $dir"
                find "$dir" -type f \( -name "generate_appcast" -o -name "generate_keys" -o -name "sign_update" \) -exec cp {} bin/ \;
                if [ -d "$dir/bin" ]; then
                  cp "$dir/bin"/* bin/ 2>/dev/null || true
                fi
              fi
            done
          fi
          
          # Make executable
          chmod +x bin/* 2>/dev/null || true
          
          # Verify installation
          echo "📋 Installed tools:"
          ls -la bin/ || echo "⚠️ bin directory is empty"
          
          # Cleanup
          rm -rf Sparkle* sparkle* Sparkle.tar.xz 2>/dev/null || true
          
          # Verify we have the required tools
          if [ -f "bin/generate_appcast" ] || [ -f "bin/generate_appcast.sh" ]; then
            echo "✅ Sparkle tools installed"
          else
            echo "⚠️ generate_appcast not found, will use fallback method"
          fi
      
      - name: Import certificates
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "🔐 Importing certificates..."
          
          # Create temporary keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Decode and import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign
          
          # Set certificate trust
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          
          # Verify certificate
          echo "📋 Installed certificates:"
          security find-identity -v -p codesigning build.keychain
          
          # Cleanup
          rm certificate.p12
          echo "✅ Certificates imported"
      
      - name: Build RustMate
        run: |
          echo "🔨 Building RustMate..."
          
          # Clean previous builds
          rm -rf build
          mkdir -p build
          
          # Archive
          xcodebuild -scheme RustMate \
            -configuration Release \
            -archivePath build/RustMate.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive | xcpretty || xcodebuild -scheme RustMate \
            -configuration Release \
            -archivePath build/RustMate.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive
          
          # Export
          xcodebuild -exportArchive \
            -archivePath build/RustMate.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
          
          # Verify exported app
          if [ ! -d "build/Export/RustMate.app" ]; then
            echo "❌ Failed to export app"
            exit 1
          fi
          
          echo "✅ Build complete: build/Export/RustMate.app"
          ls -lh build/Export/
      
      - name: Create DMG
        run: |
          echo "📦 Creating DMG..."
          DMG_NAME="${{ steps.vars.outputs.dmg_name }}"
          APP_PATH="build/Export/RustMate.app"
          
          # Create temporary directory for DMG contents
          mkdir -p dmg_temp
          
          # Copy application
          cp -R "$APP_PATH" dmg_temp/
          
          # Create Applications symlink
          ln -s /Applications dmg_temp/Applications
          
          # Create DMG using hdiutil
          hdiutil create -volname "RustMate" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            -fs HFS+ \
            "$DMG_NAME"
          
          # Cleanup
          rm -rf dmg_temp
          
          # Verify DMG
          if [ ! -f "$DMG_NAME" ]; then
            echo "❌ Failed to create DMG"
            exit 1
          fi
          
          echo "✅ DMG created: $DMG_NAME ($(du -h "$DMG_NAME" | cut -f1))"
      
      - name: Sign DMG
        run: |
          echo "✍️ Signing DMG..."
          DMG_NAME="${{ steps.vars.outputs.dmg_name }}"
          
          # Find certificate name
          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | \
            grep "Developer ID Application" | \
            head -1 | \
            sed 's/.*"\(.*\)".*/\1/')
          
          if [ -z "$CERT_NAME" ]; then
            echo "❌ Certificate not found"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          
          echo "Using certificate: $CERT_NAME"
          
          # Sign DMG
          codesign --sign "$CERT_NAME" \
            --timestamp \
            --verbose \
            --force \
            "$DMG_NAME"
          
          # Verify signature
          codesign --verify --verbose "$DMG_NAME"
          if [ $? -ne 0 ]; then
            echo "❌ DMG signature verification failed"
            exit 1
          fi
          
          echo "✅ DMG signed"
      
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          echo "📋 Notarizing DMG..."
          DMG_NAME="${{ steps.vars.outputs.dmg_name }}"
          
          # Submit for notarization
          echo "Submitting $DMG_NAME for notarization..."
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$PASSWORD" \
            --wait \
            --timeout 30m 2>&1)
          
          echo "$SUBMISSION_OUTPUT"
          
          # Check if notarization succeeded
          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
            echo "✅ Notarization accepted"
          else
            echo "❌ Notarization failed or was rejected"
            echo "$SUBMISSION_OUTPUT"
            
            # Try to get submission ID for logs
            SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -i "id:" | head -1 | awk '{print $NF}' | tr -d '[:space:]')
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching notarization logs for $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" \
                --password "$PASSWORD" || true
            fi
            exit 1
          fi
          
          # Staple notarization ticket
          echo "📎 Stapling notarization ticket..."
          xcrun stapler staple "$DMG_NAME"
          
          # Verify staple
          xcrun stapler validate "$DMG_NAME"
          if [ $? -ne 0 ]; then
            echo "⚠️ Stapler validation failed, but continuing..."
          fi
          
          echo "✅ DMG notarized and stapled"
      
      - name: Verify DMG
        run: |
          echo "🔍 Verifying DMG..."
          DMG_NAME="${{ steps.vars.outputs.dmg_name }}"
          
          # Verify signature
          codesign --verify --verbose "$DMG_NAME"
          if [ $? -ne 0 ]; then
            echo "❌ Code signature verification failed"
            exit 1
          fi
          
          # Verify notarization
          spctl --assess --type open --context context:primary-signature -v "$DMG_NAME"
          if [ $? -ne 0 ]; then
            echo "⚠️ Notarization check failed, but DMG may still work"
          fi
          
          # Verify staple
          xcrun stapler validate "$DMG_NAME"
          if [ $? -ne 0 ]; then
            echo "⚠️ Stapler validation failed, but continuing..."
          fi
          
          echo "✅ DMG verification complete"
      
      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "📡 Generating appcast..."
          DMG_NAME="${{ steps.vars.outputs.dmg_name }}"
          RELEASES_DIR="releases"
          
          # Create releases directory
          mkdir -p "$RELEASES_DIR"
          
          # Copy DMG to releases directory
          cp "$DMG_NAME" "$RELEASES_DIR/"
          
          # Import Sparkle private key
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > sparkle_private_key.txt
            if [ -f "bin/generate_keys" ]; then
              ./bin/generate_keys -f sparkle_private_key.txt || echo "⚠️ Failed to import key, continuing..."
            fi
            rm -f sparkle_private_key.txt
          else
            echo "⚠️ SPARKLE_PRIVATE_KEY not set, appcast may not be signed"
          fi
          
          # Generate appcast
          if [ -f "bin/generate_appcast" ]; then
            ./bin/generate_appcast \
              --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
              "$RELEASES_DIR"
          else
            echo "⚠️ generate_appcast not found, creating minimal appcast..."
            # Create minimal appcast manually using echo to avoid YAML heredoc issues
            {
              echo '<?xml version="1.0" encoding="utf-8"?>'
              echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
              echo '<channel>'
              echo '    <item>'
              echo "        <title>RustMate ${{ steps.vars.outputs.version }}</title>"
              echo '        <sparkle:version>1000000</sparkle:version>'
              echo "        <sparkle:shortVersionString>${{ steps.vars.outputs.version }}</sparkle:shortVersionString>"
              echo "        <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$DMG_NAME\" type=\"application/octet-stream\"/>"
              echo '    </item>'
              echo '</channel>'
              echo '</rss>'
            } > appcast.xml
          fi
          
          # Save appcast for this release
          cp appcast.xml "appcast-${{ steps.vars.outputs.version }}.xml"
          
          echo "✅ Appcast generated"
          cat appcast.xml
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.vars.outputs.dmg_name }}
            appcast-${{ steps.vars.outputs.version }}.xml
          prerelease: ${{ steps.vars.outputs.is_beta }}
          draft: false
          generate_release_notes: true
          body: |
            ## Installation
            
            1. Download `${{ steps.vars.outputs.dmg_name }}`
            2. Open the DMG
            3. Drag RustMate to Applications
            
            ## Update Channel
            
            ${{ steps.vars.outputs.is_beta && '- **Beta Release**: Available to users who enable "Receive Beta Updates" in Settings' || '- **Stable Release**: Automatically available to all users' }}
            
            ## Checksums
            
            \`\`\`
            SHA256: ${{ hashFiles(format('{0}', steps.vars.outputs.dmg_name)) }}
            \`\`\`
      
      - name: Update appcast files on gh-pages
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Updating appcast files..."
          
          # Determine which appcast to update
          if [[ "${{ steps.vars.outputs.version }}" == *"beta"* ]]; then
            APPCAST_FILE="appcast-beta.xml"
            CHANNEL="beta"
          else
            APPCAST_FILE="appcast-stable.xml"
            CHANNEL="stable"
          fi
          
          # Save the new appcast item before switching branches
          NEW_APPCAST_FILE="appcast-${{ steps.vars.outputs.version }}.xml"
          NEW_ITEM_TEMP=$(mktemp)
          if [ -f "$NEW_APPCAST_FILE" ]; then
            cat "$NEW_APPCAST_FILE" | sed -n '/<item>/,/<\/item>/p' > "$NEW_ITEM_TEMP" || echo "" > "$NEW_ITEM_TEMP"
          else
            echo "⚠️ New appcast file not found: $NEW_APPCAST_FILE"
            echo "" > "$NEW_ITEM_TEMP"
          fi
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch and checkout gh-pages
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/gh-pages || git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            echo "⚠️ gh-pages branch does not exist, creating..."
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          
          # Read the new item
          NEW_ITEM=$(cat "$NEW_ITEM_TEMP")
          rm "$NEW_ITEM_TEMP"
          
          # Function to insert item into appcast
          insert_item() {
            local file=$1
            local item=$2
            
            if [ ! -f "$file" ] || [ ! -s "$file" ]; then
              # Create new appcast file using echo to avoid YAML heredoc issues
              {
                echo '<?xml version="1.0" encoding="utf-8"?>'
                echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
                echo '<channel>'
                echo '    <title>RustMate Updates</title>'
                echo '    <description>RustMate update feed</description>'
                echo '    <language>en</language>'
                echo "${item}"
                echo '</channel>'
                echo '</rss>'
              } > "$file"
            else
              # Insert item before </channel>
              # Use perl for better XML handling (available on macOS)
              if command -v perl &> /dev/null; then
                perl -i -pe "s|</channel>|${item}\n</channel>|" "$file"
              else
                # Fallback to sed
                sed -i.bak "s|</channel>|${item}\n</channel>|" "$file" && rm -f "${file}.bak"
              fi
            fi
          }
          
          # Update the appropriate appcast file
          if [ -n "$NEW_ITEM" ]; then
            insert_item "$APPCAST_FILE" "$NEW_ITEM"
            echo "✅ Updated $APPCAST_FILE"
          else
            echo "⚠️ No new item to insert"
          fi
          
          # If stable release, also update beta appcast
          if [[ "$CHANNEL" == "stable" ]] && [ -n "$NEW_ITEM" ]; then
            insert_item "appcast-beta.xml" "$NEW_ITEM"
            echo "✅ Updated appcast-beta.xml"
          fi
          
          # Commit and push
          git add "$APPCAST_FILE" 2>/dev/null || true
          if [[ "$CHANNEL" == "stable" ]]; then
            git add appcast-beta.xml 2>/dev/null || true
          fi
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Update appcast for ${{ steps.vars.outputs.version }}" || echo "Commit failed"
            git push origin gh-pages || echo "⚠️ Push failed, may need manual intervention"
          fi
          
          echo "✅ Appcast files update complete"
      
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
